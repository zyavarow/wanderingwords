plugins { id 'com.android.application' }

android {
    namespace 'com.zyavarow.wanderingwords'
    compileSdk 34
    defaultConfig {
        applicationId 'com.zyavarow.wanderingwords'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    signingConfigs {
        release {
            storeFile file('lexicon.keystore')
            storePassword 'lexicon123'
            keyAlias 'lexicon'
            keyPassword 'lexicon123'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
